name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app
        run: ./gradlew assembleDebug --stacktrace

      # Versión para Google Play (.aab) firmada con la clave de subida. Solo si están los secretos
      # FIRMA_KEYSTORE_BASE64 y FIRMA_PASSWORD (Settings › Secrets and variables › Actions).
      - name: Compilar para Google Play
        env:
          FIRMA_KEYSTORE_BASE64: ${{ secrets.FIRMA_KEYSTORE_BASE64 }}
          FIRMA_PASSWORD: ${{ secrets.FIRMA_PASSWORD }}
        run: |
          if [ -z "$FIRMA_KEYSTORE_BASE64" ]; then
            echo "Sin clave de subida: no se genera la versión de Google Play"
            exit 0
          fi
          echo "$FIRMA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subida.jks"
          export FIRMA_KEYSTORE_PATH="$RUNNER_TEMP/subida.jks"
          ./gradlew bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/subida.jks"

      - name: Guardar el paquete de Google Play
        if: hashFiles('app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: GooglePlay-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Leer la versión de la app
        id: version
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          N=${V%.0}
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "nombre=$N" >> "$GITHUB_OUTPUT"
          echo "Versión: Alpha $N"

      - name: Renombrar el APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DashcamsEspana-Alpha-${{ steps.version.outputs.nombre }}.apk"
          # Copia con nombre fijo para el enlace de "última versión", que no cambia nunca
          cp app/build/outputs/apk/debug/app-debug.apk DashcamsEspana.apk

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: DashcamsEspana-Alpha-${{ steps.version.outputs.nombre }}
          path: DashcamsEspana-Alpha-${{ steps.version.outputs.nombre }}.apk

      # Una publicación por versión ("Alpha 0.5"). Si se vuelve a compilar la misma versión,
      # se sustituye el APK de esa misma publicación.
      - name: Publicar la versión (descarga directa del APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ steps.version.outputs.version }}
          name: Alpha ${{ steps.version.outputs.nombre }}
          # Se marca como la última: así el enlace .../releases/latest siempre lleva a la más nueva
          # (GitHub ordena mal la lista: pone la 0.10 detrás de la 0.9.9).
          prerelease: false
          make_latest: true
          body: |
            Dashcams España · Alpha ${{ steps.version.outputs.nombre }}
            Compilada automáticamente desde el commit ${{ github.sha }}.
            Descárgala desde el móvil e instálala encima de la versión anterior (no se pierden los clips).
            Enlace que siempre lleva a la última versión: https://github.com/${{ github.repository }}/releases/latest/download/DashcamsEspana.apk
          files: |
            DashcamsEspana-Alpha-${{ steps.version.outputs.nombre }}.apk
            DashcamsEspana.apk
