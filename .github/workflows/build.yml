name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DashcamsEspana-prueba-${{ github.run_number }}.apk

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: DashcamsEspana-prueba-${{ github.run_number }}
          path: DashcamsEspana-prueba-${{ github.run_number }}.apk

      - name: Publicar versión de prueba (descarga directa del APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-${{ github.run_number }}
          name: Versión de prueba ${{ github.run_number }}
          prerelease: true
          body: |
            APK de prueba generado automáticamente desde el commit ${{ github.sha }}.
            Descárgalo desde el móvil e instálalo encima de la versión anterior.
          files: DashcamsEspana-prueba-${{ github.run_number }}.apk
